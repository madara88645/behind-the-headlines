<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vox Pop · Behind the Headlines</title>
<meta name="description" content="Walk around a made-up Irish town next to a data-centre campus, interview residents, file a headline - then meet the real survey of 200 people.">
<meta name="theme-color" content="#CFE4E4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700;800&family=Kalam:wght@400;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games/vox-pop/style.css">
</head>
<body>
<a class="skip" href="#world">Skip to the game</a>

<canvas id="world" tabindex="0" aria-label="The town of Ballinacloud. Walk with the arrow keys or W A S D, or click where you want to go. Press E to talk to someone nearby."></canvas>

<!-- ======================================================= HUD -->
<header class="hud-top">
  <a class="back" href="index.html"><span aria-hidden="true">←</span> Home</a>
  <div class="brand" aria-label="Vox Pop">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><rect x="9" y="12" width="6" height="10" rx="2" fill="#241C17"/><circle cx="12" cy="8" r="6.5" fill="#9B3D8F"/><circle cx="10" cy="6" r="1.8" fill="#fff" opacity=".5"/></svg></span>
    <span class="brand-word">Vox Pop</span>
    <span class="brand-sub">Ballinacloud Community Radio</span>
  </div>
  <div class="story-chip" id="story-chip" hidden></div>
  <div class="clock" id="clock" hidden>
    <span class="onair" id="onair-light" aria-hidden="true">On air</span>
    <span class="clock-time" id="clock-time">09:00</span>
    <span class="clock-left" id="clock-left"></span>
  </div>
  <button class="btn ghost small" type="button" id="btn-help">How this works</button>
</header>

<aside class="tally" id="tally" hidden aria-label="Your vox pop so far"></aside>

<div class="hud-actions" id="actions" hidden>
  <button class="btn speak" type="button" id="btn-talk" hidden></button>
  <button class="btn ghost" type="button" id="btn-notebook">Notebook <kbd>N</kbd><span class="nb-pulse" id="nb-pulse" aria-hidden="true"></span></button>
  <button class="btn primary" type="button" id="btn-file">File story <kbd>F</kbd></button>
</div>

<div class="minimap-wrap" id="minimap-wrap" hidden aria-hidden="true">
  <canvas id="minimap" width="200" height="110"></canvas>
  <div class="mm-legend"><span class="mm-you">You</span><span class="mm-data">Data point</span></div>
</div>

<p class="toast" id="toast" hidden></p>
<div class="coach" id="coach" hidden>
  <canvas class="coach-av" id="coach-av" width="96" height="96" aria-hidden="true"></canvas>
  <p id="coach-text" aria-live="polite"></p>
</div>

<!-- ======================================================= PHONE: messages from your editor (the intro, then each story's brief) -->
<section class="panel phone" id="p-phone" data-screen="start brief" aria-label="Messages from Maura, your editor" hidden>
  <div class="device">
    <div class="screen">
      <div class="ph-status" aria-hidden="true"><span id="ph-time">09:00</span><span class="ph-island"></span><span class="ph-icons"><i class="sig"></i><i class="bat"></i></span></div>
      <div class="ph-head">
        <canvas class="ph-av" id="ph-av" width="96" height="96" aria-hidden="true"></canvas>
        <p class="ph-who"><b>Maura</b><span>Editor</span></p>
      </div>
      <div class="ph-thread" id="ph-thread" role="log" aria-live="polite" tabindex="-1"></div>
      <div class="ph-foot" id="ph-foot"></div>
    </div>
  </div>
  <p class="ph-cap" id="ph-cap"></p>
</section>

<!-- ======================================================= INTERVIEW -->
<section class="panel talk" id="p-talk" data-screen="talk" aria-labelledby="talk-name" hidden></section>

<!-- ======================================================= DATA POINT -->
<section class="panel fact" id="p-fact" data-screen="fact" aria-labelledby="fact-h" hidden></section>

<!-- ======================================================= NOTEBOOK -->
<section class="panel notebook" id="p-notebook" data-screen="notebook" aria-labelledby="nb-h" hidden></section>

<!-- ======================================================= FILE -->
<section class="panel file" id="p-file" data-screen="file" aria-labelledby="file-h" hidden></section>

<!-- ======================================================= ON AIR + CROWD -->
<div class="onair-banner" id="onair-banner" hidden aria-live="polite"></div>

<!-- ======================================================= REPORT -->
<section class="panel report" id="p-report" data-screen="report" aria-labelledby="report-h" hidden></section>

<!-- ======================================================= END -->
<section class="panel end" id="p-end" data-screen="end" aria-labelledby="end-h" hidden></section>

<!-- ======================================================= HOW THIS WORKS -->
<section class="panel help" id="p-help" data-screen="help" role="dialog" aria-modal="true" aria-labelledby="help-h" hidden></section>

<p id="announcer" class="sr-only" aria-live="polite"></p>
<noscript><p class="noscript">Vox Pop needs JavaScript to run.</p></noscript>

<script src="data/survey_stats.js"></script>
<script src="data/facts.js"></script>
<script src="shared/survey.js"></script>
<script src="games/vox-pop/world.js"></script>
<script src="games/vox-pop/art.js"></script>
<script src="games/vox-pop/sim.js"></script>
<script src="games/vox-pop/people.js"></script>
<script src="games/vox-pop/game.js"></script>
</body>
</html>
